name: mobpro_local_storage
description: "A Flutter project demonstrating SQFlite CRUD operations and Hive alternative local storage."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path_provider: ^2.1.2
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

